<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRPG 世界設定</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%223%22 width=%2224%22 height=%2226%22 rx=%223%22 fill=%22%23fff4b8%22 stroke=%22%231a2030%22 stroke-width=%222%22/%3E%3Cpath d=%22M9 12h14M9 17h14M9 22h9%22 stroke=%22%231a2030%22 stroke-width=%222%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1 class="brand">TRPG 世界設定</h1>
    <button type="button" class="world-btn" id="worldBtn" aria-haspopup="menu"><span id="worldName">…</span> ▾</button>
    <span class="save" id="saveStatus" role="status"></span>
    <div class="top-tools">
      <input type="search" id="search" placeholder="付箋を探す" aria-label="付箋を探す" autocomplete="off">
      <button type="button" class="btn primary" id="newNote" title="新しい付箋（N）">＋ 付箋</button>
      <button type="button" class="btn icon" id="undo" title="元に戻す（Ctrl+Z）" aria-label="元に戻す" disabled>↶</button>
      <button type="button" class="btn icon" id="redo" title="やり直す（Ctrl+Y）" aria-label="やり直す" disabled>↷</button>
      <button type="button" class="btn icon" id="settingsBtn" title="設定" aria-label="設定">⚙</button>
    </div>
  </header>
  <nav class="views" id="views" aria-label="画面"></nav>
  <main class="view" id="view"></main>
  <aside class="panel" id="panel" hidden aria-label="付箋"></aside>
</div>
<div id="menu" class="menu" hidden role="menu"></div>
<div id="toast" class="toast" hidden role="status"></div>
<dialog id="dlg">
  <form id="dlgForm" method="dialog">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <p id="dlgErr" class="err" hidden role="alert"></p>
    <div class="dlg-actions">
      <button type="button" id="dlgDel" class="btn danger" hidden>削除</button>
      <span class="sp"></span>
      <button type="button" id="dlgCancel" class="btn">やめる</button>
      <button type="submit" id="dlgOk" class="btn primary">保存</button>
    </div>
  </form>
</dialog>
<script type="module" src="js/main.js"></script>
</body>
</html>

<title>時系列マップ試作</title>
<!--
  試作品（捨てる前提）。設計メモ §10 の「時系列マップを先に試す」ためのもの。
  保存機能なし・サンプルデータ固定。本体を作るときにこのコードは流用しない。
  第2版：線の長さ＝体験する情報（付箋）の量。主体を選ぶと世界線を切り分けて、体験した順に1本につなぎ直す。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@600&display=swap">
<style>
/* 画面構成：上に視点の切り替えと設定、その下を時系列マップが埋める一画面アプリ。下端に凡例 */
:root {
  --bg: #e8ebef; --surface: #f9fafb; --fg: #1a2030; --muted: #5a6475; --line: #c5ccd6;
  --c-main: #2a3246; --c-ryugu: #12847e; --c-beta: #6b4cc2; --c-dream: #3155cf;
  --accent: #1d8039; --paradox: #cf3434;
  --font-ui: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
  --font-title: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1b212b; --fg: #e5e8ee; --muted: #98a1b1; --line: #343c4a;
    --c-main: #d9dde6; --c-ryugu: #3cc2ba; --c-beta: #a88cf2; --c-dream: #7c98f7;
    --accent: #4bd07a; --paradox: #f06a6a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1b212b; --fg: #e5e8ee; --muted: #98a1b1; --line: #343c4a;
  --c-main: #d9dde6; --c-ryugu: #3cc2ba; --c-beta: #a88cf2; --c-dream: #7c98f7;
  --accent: #4bd07a; --paradox: #f06a6a; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  display: flex; flex-direction: column; gap: 8px; overflow: hidden;
  padding-inline: 16px; padding-block: 10px; box-sizing: border-box;
}
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-family: var(--font-title); font-size: 20px; margin: 0; letter-spacing: .04em; }
.badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 13px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.ex { text-decoration: line-through; color: var(--muted); }
.chip.only { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details.settings { font-size: 13px; }
details.settings summary { cursor: pointer; color: var(--muted); }
.panel {
  display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; align-items: center;
  margin-top: 8px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
}
.panel > span { color: var(--muted); }
.panel input[type="search"] { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; width: 100%; max-width: 280px; }
.panel .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.stage { position: relative; flex: 1; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.drag { cursor: grabbing; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; }
.zoom button { font: inherit; font-size: 13px; min-width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
#tip {
  position: absolute; pointer-events: none; max-width: 300px; z-index: 2;
  background: var(--fg); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5;
}
#tip b { font-size: 13px; }
#tip .d { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
#tip .m { opacity: .75; }
#toast {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3; max-width: min(520px, calc(100% - 32px));
  background: var(--paradox); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 1.5;
  box-shadow: 0 6px 24px rgb(0 0 0 / .25); cursor: pointer;
}
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); align-items: center; }
.legend svg { vertical-align: middle; margin-right: 4px; }
/* 地図の中身 */
.t-main { stroke: var(--c-main); } .t-ryugu { stroke: var(--c-ryugu); } .t-beta { stroke: var(--c-beta); } .t-dream { stroke: var(--c-dream); }
.f-main { fill: var(--c-main); } .f-ryugu { fill: var(--c-ryugu); } .f-beta { fill: var(--c-beta); } .f-dream { fill: var(--c-dream); }
.pc { fill: none; stroke-width: 3; stroke-linecap: round; transition: opacity .2s; }
.pc.ctr { stroke-width: 7; }
.pc.dup { stroke-dasharray: 7 6; stroke-linecap: butt; }
.pc.old { stroke-width: 2; stroke-dasharray: 2 5; opacity: .35; }
.pc.on { stroke-width: 9; }
.pc.ctr.on { stroke-width: 11; }
.off { opacity: .22; }
.cut { fill: none; stroke-width: 1.4; stroke-dasharray: 2 4; }
.lk { fill: none; stroke-width: 1.6; stroke-dasharray: 6 4; stroke: var(--muted); }
.lk.k-paradox { stroke: var(--paradox); stroke-width: 2.2; }
.jt { fill: var(--surface); stroke: var(--fg); stroke-width: 2; }
.jt.k-paradox { stroke: var(--paradox); }
.hit { fill: none; stroke: transparent; stroke-width: 18; pointer-events: stroke; }
.card rect.bg { fill: var(--surface); stroke: var(--line); }
.card text { fill: var(--fg); font-size: 12px; }
.card.dim { opacity: .22; }
.card.again { opacity: .55; }
.card.hl rect.bg { stroke: var(--accent); stroke-width: 2; }
.card.grp rect.bg { fill: var(--fg); stroke: var(--fg); }
.card.grp text { fill: var(--bg); font-weight: 600; }
.card { cursor: default; } .card.grp { cursor: pointer; }
.stem { stroke: var(--line); stroke-width: 1; }
.lbl { fill: var(--muted); font-size: 11px; }
.lbl.tr { font-weight: 600; font-size: 11px; }
.lbl.head { fill: var(--fg); font-weight: 600; font-size: 13px; }
.gapl { fill: var(--muted); font-size: 10px; font-family: var(--font-data); }
@media (max-width: 560px) {
  .brand h1 { font-size: 17px; }
  .chip { font-size: 12px; padding: 3px 10px; }
  .legend { font-size: 11px; }
}
</style>

<header class="bar">

</main>
<footer class="legend">
  <span><svg width="34" height="10"><line x1="3" y1="5" x2="31" y2="5" stroke="currentColor" stroke-width="7" stroke-linecap="round"/></svg>主体が体験した順につないだ線</span>
  <span><svg width="34" height="10"><line x1="3" y1="5" x2="31" y2="5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>主体が通らなかった残り</span>
  <span><svg width="34" height="10"><line x1="3" y1="5" x2="31" y2="5" stroke="currentColor" stroke-width="6" stroke-dasharray="7 6"/></svg>同じ時間の2回目以降</span>
  <span><svg width="34" height="10"><line x1="3" y1="5" x2="31" y2="5" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 4"/></svg>切れ目のつながり</span>
  <span><svg width="14" height="12"><rect x="3" y="2" width="8" height="8" transform="rotate(45 7 6)" fill="none" stroke="currentColor" stroke-width="2"/></svg>つなぎ目（分岐・時間移動など）</span>
  <span>線の長さ＝付箋の数。実際の年月は「≈」とカーソル（スマホはタップ）で表示</span>
</footer>

<script>
// ===== 暦 =====
// 日時は「日の通し番号（ユリウス通日）＋日の中の割合」で持つ。整数部が暦日、小数部が時刻
const J2000 = 2451545, YEAR = 365.2425, GREG_START = 2299161; // GREG_START = 1582年10月15日
const fdiv = (a, b) => Math.floor(a / b);
function jdnGreg(y, m, d) {
  const a = fdiv(14 - m, 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  return d + fdiv(153 * mm + 2, 5) + 365 * yy + fdiv(yy, 4) - fdiv(yy, 100) + fdiv(yy, 400) - 32045;
}
function jdnJul(y, m, d) {
  const a = fdiv(14 - m, 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  return d + fdiv(153 * mm + 2, 5) + 365 * yy + fdiv(yy, 4) - 32083;
}
// 西暦：1582年10月15日以降はグレゴリオ暦、それより前はユリウス暦。y は天文式（紀元前1年 = 0）
function W(y, m = 1, d = 1, h = 0, mi = 0) {
  const g = jdnGreg(y, m, d);
  return (g >= GREG_START ? g : jdnJul(y, m, d)) + (h * 60 + mi) / 1440;
}
const ago = years => J2000 - years * YEAR;
function ymd(J) {
  const greg = J >= GREG_START;
  let shift = 0;
  if (J < 0) { const k = Math.ceil(-J / 1461); J += k * 1461; shift = 4 * k; } // ユリウス暦は4年で1461日
  let f = J + 1401;
  if (greg) f += fdiv(fdiv(4 * J + 274277, 146097) * 3, 4) - 38;
  const e = 4 * f + 3, g = fdiv(e % 1461, 4), h = 5 * g + 2;
  const M = (fdiv(h, 153) + 2) % 12 + 1;
  return [fdiv(e, 1461) - 4716 + fdiv(14 - M, 12) - shift, M, fdiv(h % 153, 5) + 1];
}
const sig = (v, n = 3) => +v.toPrecision(n);
function fmtAgo(y) {
  if (y >= 1e8) return `約${sig(y / 1e8)}億年前`;
  if (y >= 1e4) return `約${sig(y / 1e4)}万年前`;
  return `約${Math.round(y)}年前`;
}
function hm(t) { const m = Math.floor((t - Math.floor(t)) * 1440 + 1e-6); return ` ${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; }
function fmtWest(t, name, prec) {
  const pre = name ? name + ' ' : '';
  const yearsAgo = (J2000 - t) / YEAR;
  if (yearsAgo > 12000) return pre + fmtAgo(yearsAgo);
  const n = Math.floor(t), [y, m, d] = ymd(n);
  const ys = y <= 0 ? `紀元前${1 - y}年` : `${y}年`;
  if (prec === 'year') return pre + ys;
  if (prec === 'month') return `${pre}${ys}${m}月`;
  const jul = n < GREG_START ? '（ユリウス暦）' : '';
  return `${pre}${ys}${m}月${d}日${prec === 'min' ? hm(t) : ''}${jul}`;
}
// 架空の暦の例：夢暦（1年 = 12か月 × 30日）
const DREAM_MONTHS = ['霧', '猫', '月獣', '翠玉', '黄昏', '星', '夜鬼', '琥珀', '銀鍵', '深淵', '夢見', '覚醒'];
const DR = (y, m = 1, d = 1) => (y - 1) * 360 + (m - 1) * 30 + (d - 1);
function fmtDream(t, prec, pre = '夢暦 ') {
  const n = Math.floor(t), y = fdiv(n, 360) + 1, r = n - (y - 1) * 360, m = fdiv(r, 30), d = r - m * 30 + 1;
  if (prec === 'year') return `${pre}${y}年`;
  if (prec === 'month') return `${pre}${y}年 ${DREAM_MONTHS[m]}の月`;
  return `${pre}${y}年 ${DREAM_MONTHS[m]}の月${d}日${prec === 'min' ? hm(t) : ''}`;
}
function fmtDur(days, yearLen = YEAR) {
  const y = days / yearLen;
  if (y >= 1e8) return `${sig(y / 1e8)}億年`;
  if (y >= 1e4) return `${sig(y / 1e4)}万年`;
  if (y >= 1) return `${sig(y)}年`;
  if (days >= 1) return `${Math.round(days)}日`;
  const mins = Math.round(days * 1440);
  return mins >= 60 ? `${Math.floor(mins / 60)}時間${mins % 60 ? (mins % 60) + '分' : ''}` : `${mins}分`;
}
const precFor = span => span >= 100 * YEAR ? 'year' : span >= 2 * YEAR ? 'month' : span >= 3 ? 'day' : 'min';

// ===== サンプルの世界 =====
const LOOP_START = W(2025, 8, 17), LOOP_END = W(2025, 8, 31, 23, 59);
const tracks = [
  { id: 'main', name: '本線', lane: 0, from: ago(13.8e9), to: W(2100), fmt: (t, p) => fmtWest(t, '西暦', p), short: (t, p) => fmtWest(t, '', p) },
  { id: 'ryugu', name: '竜宮', lane: -1, from: W(720), to: W(723), fmt: (t, p) => fmtWest(t, '西暦;竜宮', p), short: (t, p) => fmtWest(t, '', p) },
  { id: 'beta', name: '世界線β', lane: 1, from: W(1850, 6, 1, 12), to: W(2100), fmt: (t, p) => fmtWest(t, '西暦;β', p), short: (t, p) => fmtWest(t, '', p) },
  { id: 'dream', name: 'ドリームランド', lane: 2, from: DR(1), to: DR(2001), fmt: fmtDream, short: (t, p) => fmtDream(t, p, ''), yearLen: 360 },
];
// sync: その2点が「同じ瞬間」として結ばれている（分岐・合流・夢との出入り）。時間移動とループは同じ瞬間ではない
const links = [
  { a: ['main', W(720)], b: ['ryugu', W(720)], kind: '分岐（竜宮へ）', sync: true },
  { a: ['ryugu', W(723)], b: ['main', W(1020)], kind: '合流（竜宮から）', sync: true },
  { a: ['main', W(1850, 6, 1, 12)], b: ['beta', W(1850, 6, 1, 12)], kind: '世界線の分岐', sync: true },
  { a: ['main', W(2025, 6, 1, 12)], b: ['beta', W(1850, 6, 1, 12)], kind: '時間移動（パラドックス発生）', paradox: true },
  { a: ['main', W(1920, 3, 1, 23)], b: ['dream', DR(1203)], kind: '眠ってドリームランドへ', sync: true },
  { a: ['dream', DR(1215)], b: ['main', W(1920, 3, 2, 7)], kind: '目覚めて現実へ', sync: true },
  { a: ['main', W(1985, 10, 26, 1, 35)], b: ['main', W(1955, 11, 5, 6)], kind: '時間移動' },
  { a: ['main', W(1955, 11, 12, 22, 4)], b: ['main', W(1985, 10, 26, 1, 24)], kind: '時間移動' },
  { a: ['main', LOOP_END], b: ['main', LOOP_START], kind: 'ループ', loop: true },
];
// 主体の道筋：[世界線, 入った時点, 出た時点] を本人が体験した順に並べる
const subjects = [
  { id: 'urashima', name: '浦島太郎', legs: [['main', W(700), W(720)], ['ryugu', W(720), W(723)], ['main', W(1020), W(1020, 1, 5)]] },
  { id: 'dreamer', name: '夢見る者R', legs: [['main', W(1890, 8, 20), W(1920, 3, 1, 23)], ['dream', DR(1203), DR(1215)], ['main', W(1920, 3, 2, 7), W(1937, 3, 15)]] },
  { id: 'loop', name: 'ループする少女', legs: [['main', W(2010, 4, 2), LOOP_END], ['main', LOOP_START, LOOP_END], ['main', LOOP_START, W(2090)]] },
  { id: 'm', name: '時間旅行者M', legs: [['main', W(1968, 6, 12), W(1985, 10, 26, 1, 35)], ['main', W(1955, 11, 5, 6), W(1955, 11, 12, 22, 4)], ['main', W(1985, 10, 26, 1, 24), W(2040)]] },
  { id: 'k', name: '時間旅行者K', legs: [['main', W(1995, 3, 3), W(2025, 6, 1, 12)], ['beta', W(1850, 6, 1, 12), W(1900)]] },
];
const events = [
  { tr: 'main', t: ago(13.8e9), title: '宇宙の始まり', tags: ['宇宙'] },
  { tr: 'main', t: ago(4.54e9), title: '地球の誕生', tags: ['宇宙'] },
  { tr: 'main', t: ago(6.6e7), title: '恐竜の絶滅', tags: ['宇宙'] },
  { tr: 'main', t: W(700), title: '浦島太郎 誕生', tags: ['浦島'] },
  { tr: 'main', t: W(719, 6, 1), title: '亀を助ける', tags: ['浦島'] },
  { tr: 'ryugu', t: W(720, 1, 2), title: '竜宮城に着く', tags: ['浦島'] },
  { tr: 'ryugu', t: W(721, 7, 7), title: '乙姫の宴', tags: ['浦島'] },
  { tr: 'ryugu', t: W(722, 12, 1), title: '故郷が恋しくなる', tags: ['浦島'] },
  { tr: 'main', t: W(1020, 1, 5), title: '玉手箱を開ける', tags: ['浦島'] },
  { tr: 'main', t: W(1582, 6, 21), title: '本能寺の変', tags: ['歴史'] },
  { tr: 'main', t: W(1920, 3, 1, 23), title: 'Rが眠りにつく', tags: ['夢'] },
  { tr: 'dream', t: DR(300), title: '古い夢の伝承', tags: ['夢'] },
  { tr: 'dream', t: DR(1205, 2, 3), title: '猫の町を訪れる', tags: ['夢'] },
  { tr: 'dream', t: DR(1210, 9, 9), title: '銀の鍵を得る', tags: ['夢'] },
  { tr: 'main', t: W(1920, 3, 2, 7), title: 'Rが目覚める', tags: ['夢'] },
  { tr: 'main', t: W(1955, 11, 12, 22, 4), title: '時計台に雷', tags: ['時間旅行'] },
  { tr: 'main', t: W(1985, 10, 26, 1, 20), title: '駐車場で実験', tags: ['時間旅行'] },
  { tr: 'main', t: W(2025, 6, 1, 12), title: 'Kが過去へ跳ぶ', tags: ['時間旅行'] },
  { tr: 'beta', t: W(1850, 6, 1, 12), title: '見知らぬ男が現れる', tags: ['時間旅行'] },
  { tr: 'beta', t: W(1851), title: '歴史が変わり始める', tags: ['歴史', '時間旅行'] },
  { tr: 'main', t: LOOP_START, title: 'ループの始まり', tags: ['ループ'], group: 'summer' },
  { tr: 'main', t: W(2025, 8, 20, 19), title: '夏祭り', tags: ['ループ'], group: 'summer' },
  { tr: 'main', t: LOOP_END, title: '夏休み最後の夜', tags: ['ループ'], group: 'summer' },
];
const groups = { summer: { title: 'シナリオ：夏の終わりのループ', open: true } };
const T = Object.fromEntries(tracks.map(t => [t.id, t]));
const OBJECTIVE = { id: null, name: '本線（客観）', legs: [['main', T.main.from, T.main.to]] };

// ===== 時点 =====
const nodeTimes = {};
{
  const s = Object.fromEntries(tracks.map(t => [t.id, new Set([t.from, t.to])]));
  for (const l of links) { s[l.a[0]].add(l.a[1]); s[l.b[0]].add(l.b[1]); }
  for (const e of events) s[e.tr].add(e.t);
  for (const sub of subjects) for (const [tr, a, b] of sub.legs) { s[tr].add(a); s[tr].add(b); }
  for (const id in s) nodeTimes[id] = [...s[id]].sort((a, b) => a - b);
}
const key = (tr, t) => tr + '|' + t;
const nodesIn = (tr, a, b) => nodeTimes[tr].filter(v => v >= a && v <= b);

// ===== 状態 =====
let activeSub = OBJECTIVE;
const tagState = {};  // 0: 通常, 1: 除外, 2: これだけ
const hiddenTracks = new Set();
let query = '', onlySub = false;

// ===== 表示中の付箋（まとめをたたむと1枚になる） =====
function eventVisible(e) {
  if (hiddenTracks.has(e.tr)) return false;
  const only = Object.keys(tagState).filter(k => tagState[k] === 2);
  if (only.length && !e.tags.some(t => only.includes(t))) return false;
  if (e.tags.some(t => tagState[t] === 1)) return false;

function refreshCards() {
  cards = [];

  events.forEach((e, i) => {
    if (!eventVisible(e)) return;
    if (e.group) {
      if (!(e.group in firstOf) || e.t < events[firstOf[e.group]].t) firstOf[e.group] = i;
      if (!groups[e.group].open) return;
    }
    cards.push({ k: 'c|' + i, e, title: e.title });

  for (const gid in firstOf) {
    const g = groups[gid];
    cards.push({ k: 'g|' + gid, e: events[firstOf[gid]], title: `${g.open ? '▾' : '▸'} ${g.title}`, grp: true, open: g.open });
  }

// ===== 長さ：付箋（情報）の数に比例させる =====

const G0 = 0.2, JOINT = 0.9, LANE = 120;

  const out = []; let cur = a;
  for (const [p, q] of cov) { if (p > cur) out.push({ a: cur, b: p, dup: false }); out.push({ a: p, b: q, dup: true }); cur = q; }

}

// ===== 配置：世界線を切り分けて、主体が体験した順に1本につなぐ =====
function computeLayout(sub) {

  sub.legs.forEach(([tr, a, b], li) => {
    if (li) x += JOINT;
    for (const s of splitCovered(cover[tr] || [], a, b)) {
      const nodes = offsets(tr, s.a, s.b).map(({ t, o }) => ({ t, x: x + o, y: 0 }));
      x = nodes[nodes.length - 1].x;

    const cov = mergeIv(cover[tr.id] || []);

    const rest = [];
    for (const [ca, cb] of cov) { if (ca > prev) rest.push([prev, ca]); prev = Math.max(prev, cb); }

  const assign = (list, sign) => {
    let used = 0;
    for (const tr of list) {
      const ps = lane.filter(p => p.tr === tr.id).sort((p, q) => p.nodes[0].x - q.nodes[0].x);
      if (!ps.length) continue;

  const where = {};

}

// ===== アニメーション：どく → 横に滑る → 中央にはまる =====
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ===== 描画 =====
const svg = document.getElementById('map'), stage = document.getElementById('stage');
const tip = document.getElementById('tip'), toast = document.getElementById('toast');
const ctx2d = document.createElement('canvas').getContext('2d');
let uiFont = '12px sans-serif';
const textW = s => { ctx2d.font = uiFont; return ctx2d.measureText(s).width; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f1 = v => Math.round(v * 10) / 10;
let focusTrack = null; // カーソルを合わせた（タップした）世界線。その破片をすべて光らせる

// 主体の区間どうしのつなぎ目に対応するつながり
function jointLink(sub, li) {
  const [ta, , va] = sub.legs[li - 1], [tb, vb] = sub.legs[li];
  return links.find(l => l.a[0] === ta && l.a[1] === va && l.b[0] === tb && l.b[1] === vb);

function render() {
  const Wd = svg.clientWidth, H = svg.clientHeight;

  const trCls = tr => focusTrack ? (focusTrack === tr ? ' on' : ' off') : '';

  // 動いている間は、元の位置に薄い跡を残す
  if (prev && prog < 1) for (const p of prev.pieces) {
    if (hiddenTracks.has(p.tr)) continue;
    back += `<path class="pc old t-${p.tr}" d="${p.nodes.map((n, i) => `${i ? 'L' : 'M'}${f1(SX(n.x))},${f1(SY(n.y))}`).join(' ')}"/>`;
  }

  const labelEnds = {}; // 段ごとに、名前が重ならないよう右端を覚えておく
  cur.pieces.forEach((p, pi) => {
    if (hiddenTracks.has(p.tr)) return;
    const pts = p.nodes.map(n => animPos(prev && prev.where[key(p.tr, n.t)], n));
    const d = pts.map((q, i) => `${i ? 'L' : 'M'}${f1(SX(q.x))},${f1(SY(q.y))}`).join(' ');
    mid += `<path class="pc t-${p.tr}${p.center ? ' ctr' : ''}${p.dup ? ' dup' : ''}${trCls(p.tr)}" d="${d}"/><path class="hit" data-k="p|${pi}" d="${d}"/>`;

    // 破片の名前と範囲
    const name = `${p.dup ? '2回目・' : ''}${T[p.tr].name} ${T[p.tr].short(p.a, precFor(p.b - p.a))}〜${T[p.tr].short(p.b, precFor(p.b - p.a))}`;
    const lx = Math.max(x1, 6), lw = textW(name) * .92;
    if ((x2 - x1 > lw + 8 || !p.center) && lx > (labelEnds[p.nodes[0].y] ?? -Infinity) + 10) {
      labelEnds[p.nodes[0].y] = lx + lw;
      mid += `<text class="lbl tr" x="${f1(lx)}" y="${f1(y + (p.center ? 22 : 18))}" opacity="${late}" style="fill:var(--c-${p.tr})">${esc(name)}</text>`;
    }
    // 実際の長さ（線の長さは時間ではないので、長い空白には年数を書く）

      const a = p.nodes[i].t, b = p.nodes[i + 1].t, gx1 = SX(pts[i].x), gx2 = SX(pts[i + 1].x);
      if (gx2 - gx1 > 64 && b - a >= YEAR) mid += `<text class="gapl" x="${f1((gx1 + gx2) / 2)}" y="${f1(y + (p.center ? 36 : 32))}" text-anchor="middle" opacity="${late}">≈${fmtDur(b - a, T[p.tr].yearLen)}</text>`;

    for (const p of cur.pieces) {
      if (p.center || hiddenTracks.has(p.tr)) continue;
      const ends = [];

      if (p.rightCut) ends.push([centerPos(p.tr, p.b), p.nodes[p.nodes.length - 1]]);

      const o = P(p.tr, p.a), x1 = SX(p.nodes[0].x), x2 = SX(o.x), y2 = SY(o.y), h = 40 + Math.min(70, Math.abs(x1 - x2) * .15);
      s += `<path class="cut t-${p.tr}${trCls(p.tr)}" d="M${f1(x1)},${f1(SY(0))} C${f1(x1)},${f1(SY(0) - h)} ${f1(x2)},${f1(Math.min(y2, SY(0)) - h)} ${f1(x2)},${f1(y2)}"/>`;
    }
    // つなぎ目（主体が次の区間へ移るところ）
    const used = new Set();
    for (let li = 1; li < cur.sub.legs.length; li++) {
      const l = jointLink(cur.sub, li);
      if (l) used.add(l);
      const firstOfLeg = cur.pieces.find(p => p.center && p.li === li), jx = SX(firstOfLeg.nodes[0].x - JOINT / 2);
      s += `<rect class="jt${l?.paradox ? ' k-paradox' : ''}" x="${f1(jx - 6)}" y="${f1(SY(0) - 6)}" width="12" height="12" transform="rotate(45 ${f1(jx)} ${f1(SY(0))})"/>`;
      s += `<line class="hit" data-k="j|${li}" x1="${f1(jx - 8)}" y1="${f1(SY(0))}" x2="${f1(jx + 8)}" y2="${f1(SY(0))}"/>`;

// 付箋。破片の上に段を作って重ならないように並べる。2回目以降の体験には薄い複製を出す

      out += `<g class="${cls}" data-k="${it.c.k}" opacity="${alpha}"><rect class="bg" x="${f1(left)}" y="${f1(top)}" width="${f1(it.w)}" height="20" rx="4"/>` +

// ===== 日時の読み取り（カーソル・タップ） =====

    const a = ns[i].t, b = ns[i + 1]?.t ?? a, t = a + (b - a) * f;

    return `<b>${esc(T[p.tr].name)}</b><div class="d">${esc(T[p.tr].fmt(t, precFor(b - a)))}</div>` +
      `<div class="m">この破片：${esc(T[p.tr].short(p.a, precFor(p.b - p.a)))}〜${esc(T[p.tr].short(p.b, precFor(p.b - p.a)))}${role ? '<br>' + role : ''}</div>`;

    return `<b>${esc(l ? l.kind : 'つなぎ目')}</b><div class="d">${esc(T[ta].fmt(va, 'min'))}</div><div class="d">→ ${esc(T[tb].fmt(vb, 'min'))}</div>`;
  }
  if (parts[0] === 'l') {
    const l = links[+parts[1]], [ta, va] = l.a, [tb, vb] = l.b;
    return `<b>${esc(l.kind)}</b><div class="d">${esc(T[ta].fmt(va, 'min'))}</div><div class="d">→ ${esc(T[tb].fmt(vb, 'min'))}</div>`;
  }
  if (parts[0] === 'c') {
    const e = events[+parts[1]], prec = e.t % 1 ? 'min' : 'day';
    return `<b>${esc(e.title)}</b><div class="d">${esc(T[e.tr].fmt(e.t, prec))}</div><div class="m">${esc(T[e.tr].name)}・タグ：${e.tags.map(esc).join('、')}</div>`;
  }
  if (parts[0] === 'g') {
    const g = groups[parts[1]], n = events.filter(e => e.group === parts[1]).length;
    return `<b>${esc(g.title)}</b><div class="m">${n}件の出来事をまとめたもの。クリック（タップ）で${g.open ? 'たたむ' : 'ひらく'}</div>`;
  }
  return '';
}
function showTip(target, clientX, clientY) {
  const k = target && target.closest?.('[data-k]')?.dataset.k;
  if (!k) { tip.hidden = true; return; }
  const r = stage.getBoundingClientRect();
  tip.innerHTML = describe(k, clientX - r.left);
  tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = clientX - r.left + 14, y = clientY - r.top + 14;
  if (x + w > r.width - 8) x = clientX - r.left - w - 14;
  if (y + h > r.height - 8) y = clientY - r.top - h - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function trackOf(target) {
  const k = target?.closest?.('[data-k]')?.dataset.k;
  return k?.startsWith('p|') ? cur.pieces[+k.split('|')[1]].tr : null;
}
function setFocus(tr) { if (focusTrack !== tr) { focusTrack = tr; render(); } }

// ===== 操作：ドラッグで移動、ホイール・ピンチ・ボタンで拡大縮小 =====
const pointers = new Map();
let dragMoved = 0, pinch = null;
function zoomAt(factor, sx) {
  const z = Math.min(1e5, Math.max(.2, cam.zoom * factor));
  cam.panX = sx - (sx - cam.panX) * (z / cam.zoom); cam.zoom = z; render();
}
svg.addEventListener('pointerdown', e => {
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, target: e.target });
  dragMoved = 0;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
  svg.classList.add('drag');
});
svg.addEventListener('pointermove', e => {
  const p0 = pointers.get(e.pointerId);
  if (!p0) {
    if (e.pointerType === 'mouse') { showTip(e.target, e.clientX, e.clientY); setFocus(trackOf(e.target)); }
    return;
  }
  const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
  p0.x = e.clientX; p0.y = e.clientY;
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    const rect = svg.getBoundingClientRect();
    zoomAt(d / (pinch.d || d), (a.x + b.x) / 2 - rect.left); pinch.d = d; return;
  }
  dragMoved += Math.abs(dx) + Math.abs(dy);
  if (dragMoved > 4) { tip.hidden = true; cam.panX += dx; cam.panY += dy; render(); }
});
function endPointer(e) {
  const p0 = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) svg.classList.remove('drag');
  if (p0 && dragMoved <= 4 && e.type === 'pointerup') {
    const g = p0.target.closest && p0.target.closest('[data-k^="g|"]');
    if (g) { const gr = groups[g.dataset.k.split('|')[1]]; gr.open = !gr.open; setView(activeSub, false); }
    showTip(p0.target, e.clientX, e.clientY);
    if (e.pointerType !== 'mouse') setFocus(trackOf(p0.target));
  }
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !pointers.size) { tip.hidden = true; setFocus(null); } });
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = svg.getBoundingClientRect();
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { cam.panX -= e.deltaX; render(); return; }
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0018)), e.clientX - rect.left);
}, { passive: false });
document.getElementById('zin').onclick = () => zoomAt(1.6, svg.clientWidth / 2);
document.getElementById('zout').onclick = () => zoomAt(1 / 1.6, svg.clientWidth / 2);
document.getElementById('fit').onclick = () => { Object.assign(cam, fitCam(cur)); render(); };
addEventListener('resize', () => { Object.assign(cam, fitCam(cur)); render(); });

// ===== 設定パネル =====
const viewsEl = document.getElementById('views');
[OBJECTIVE, ...subjects].forEach(v => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = v.name; b.dataset.id = v.id ?? '';
  b.onclick = () => { setView(v); egg(v); };
  viewsEl.append(b);
});
function updateChips() { for (const b of viewsEl.children) b.setAttribute('aria-pressed', String((b.dataset.id || null) === activeSub.id)); }

const tagsEl = document.getElementById('tags');
[...new Set(events.flatMap(e => e.tags))].forEach(t => {
  tagState[t] = 0;
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = t; b.title = 'クリックで「除外」→「これだけ表示」→「元に戻す」';
  b.onclick = () => {
    tagState[t] = (tagState[t] + 1) % 3;
    b.classList.toggle('ex', tagState[t] === 1); b.classList.toggle('only', tagState[t] === 2);
    b.textContent = t + (tagState[t] === 1 ? '（除外）' : tagState[t] === 2 ? '（これだけ）' : '');
    setView(activeSub, false);
  };
  tagsEl.append(b);
});
const tracksEl = document.getElementById('tracks');
tracks.forEach(tr => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = tr.name; b.setAttribute('aria-pressed', 'true');
  b.onclick = () => {
    hiddenTracks.has(tr.id) ? hiddenTracks.delete(tr.id) : hiddenTracks.add(tr.id);
    b.setAttribute('aria-pressed', String(!hiddenTracks.has(tr.id))); setView(activeSub, false);
  };
  tracksEl.append(b);
});
document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
document.getElementById('onlySub').addEventListener('change', e => { onlySub = e.target.checked; setView(activeSub, false); });

// ===== イースターエッグ =====
function egg(sub) {
  toast.hidden = true;
  if (!sub.id) return;
  let kind = null;
  for (let li = 1; li < sub.legs.length; li++) {
    const l = jointLink(sub, li);
    if (l?.paradox) kind = 'paradox';
    else if (l?.loop && !kind) kind = 'loop';
  }
  if (!kind) {
    const L = sub.legs;
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++)
      if (L[i][0] === L[j][0] && L[i][1] < L[j][2] && L[j][1] < L[i][2]) kind = 'self';
  }
  const msg = {
    paradox: '気をつけろ、マーティー！ 過去をいじったせいで、世界線が分かれちまったぞ！',
    self: 'グレート・スコット！ 同じ時刻に、もう一人の自分がいるぞ！ 鉢合わせだけはするなよ！',
    loop: 'この夏休み、もう何度目だ……？ エル・プサイ・コングルゥ。',
  }[kind];
  if (!msg) return;
  toast.textContent = msg; toast.hidden = false;
  clearTimeout(egg.t); egg.t = setTimeout(() => { toast.hidden = true; }, 6000);
}
toast.onclick = () => { toast.hidden = true; };

// ===== 開始 =====
uiFont = '12px ' + getComputedStyle(document.body).fontFamily;
setView(OBJECTIVE);
document.fonts?.ready.then(() => { uiFont = '12px ' + getComputedStyle(document.body).fontFamily; render(); });
</script>

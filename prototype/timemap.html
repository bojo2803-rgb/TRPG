<title>時系列マップ試作</title>
<!--
  試作品（捨てる前提）。設計メモ §10 の「時系列マップを先に試す」ためのもの。
  本体を作るときにこのコードは流用しない。編集内容はこのブラウザの中にだけ保存する（本体ではGoogleドライブ）。
  第4版：付箋・世界線・つながり・主体を画面から編集できる。
  第3版：線の長さ＝付箋の数×4 ＋ 時間が10倍になるごとに1。主体を選ぶと世界線を切り分けて、体験した順に1本につなぎ直す。
  ループは輪として描き、ループする主体を選ぶと輪がほどけて線になる。
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* 画面構成：上に視点の切り替えと設定、その下を時系列マップが埋める一画面アプリ。下端に凡例 */
:root {
  --bg: #e8ebef; --surface: #f9fafb; --fg: #1a2030; --muted: #5a6475; --line: #c5ccd6;
  --c-c0: #2a3246; --c-c1: #12847e; --c-c2: #6b4cc2; --c-c3: #3155cf; --c-c4: #a85d14; --c-c5: #b3305a;
  --accent: #1d8039; --paradox: #cf3434;

  --font-title: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1b212b; --fg: #e5e8ee; --muted: #98a1b1; --line: #343c4a;
    --c-c0: #d9dde6; --c-c1: #3cc2ba; --c-c2: #a88cf2; --c-c3: #7c98f7; --c-c4: #e5a45a; --c-c5: #f07aa0;

  --accent: #4bd07a; --paradox: #f06a6a; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui);
  display: flex; flex-direction: column; gap: 8px; overflow: hidden;
  padding-inline: 16px; padding-block: 10px; box-sizing: border-box;
}

.brand h1 { font-family: var(--font-title); font-size: 20px; margin: 0; letter-spacing: .04em; }
.badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); align-items: center; }
.legend svg { vertical-align: middle; margin-right: 4px; }
.legend-wrap summary { font-size: 12px; color: var(--muted); cursor: pointer; }
.legend-wrap[open] summary { display: none; }
/* 地図の中身 */
.t-c0 { stroke: var(--c-c0); } .t-c1 { stroke: var(--c-c1); } .t-c2 { stroke: var(--c-c2); } .t-c3 { stroke: var(--c-c3); } .t-c4 { stroke: var(--c-c4); } .t-c5 { stroke: var(--c-c5); }
.f-c0 { fill: var(--c-c0); } .f-c1 { fill: var(--c-c1); } .f-c2 { fill: var(--c-c2); } .f-c3 { fill: var(--c-c3); } .f-c4 { fill: var(--c-c4); } .f-c5 { fill: var(--c-c5); }
.pc { fill: none; stroke-width: 3; stroke-linecap: round; transition: opacity .2s; }
.pc.ctr { stroke-width: 7; }
.pc.dup { stroke-dasharray: 7 6; stroke-linecap: butt; }
.pc.old { stroke-width: 2; stroke-dasharray: 2 5; opacity: .35; }
.pc.on { stroke-width: 9; }
.pc.ctr.on { stroke-width: 11; }
.off { opacity: .22; }
.cut { fill: none; stroke-width: 1.4; stroke-dasharray: 2 4; }
.lk { fill: none; stroke-width: 1.6; stroke-dasharray: 6 4; stroke: var(--muted); }
.lk.k-paradox { stroke: var(--paradox); stroke-width: 2.2; }
.jt { fill: var(--surface); stroke: var(--fg); stroke-width: 2; }
.jt.k-paradox { stroke: var(--paradox); }

.card rect.bg { fill: var(--surface); stroke: var(--line); }
.card text { fill: var(--fg); font-size: 12px; }
.card.dim { opacity: .22; }
.card.again { opacity: .55; }
.card.hl rect.bg { stroke: var(--accent); stroke-width: 2; }
.card.grp rect.bg { fill: var(--fg); stroke: var(--fg); }
.card.grp text { fill: var(--bg); font-weight: 600; }
.card { cursor: default; } .card.grp { cursor: pointer; }
.stem { stroke: var(--line); stroke-width: 1; }
.lbl { fill: var(--muted); font-size: 11px; }
.lbl.tr { font-weight: 600; font-size: 11px; }

dialog { width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); overflow: auto; box-sizing: border-box; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); }

#dlgBody label.cb { display: flex; align-items: center; gap: 6px; }
#dlgBody input:not([type="checkbox"]), #dlgBody select { font: inherit; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }

.dt, .dt .ad, .dt .ago { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.dt input[type="number"] { width: 6.5em; }
.dt input[id$="_m"], .dt input[id$="_d"] { width: 3.8em; }
.dt label { display: flex !important; align-items: center; gap: 3px; }
.dt .cal { font-weight: 600; }
.sub { display: grid; gap: 8px; padding-left: 14px; border-left: 2px solid var(--line); }
.note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
.err { margin: 10px 0 0; color: var(--paradox); font-size: 13px; }
#s_legs { display: grid; gap: 8px; counter-reset: leg; }
.leg { display: grid; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; counter-increment: leg; }
.leg-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.leg-h b::before { content: "区間" counter(leg); }
.dlg-actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.dlg-actions .sp { flex: 1; }
.dlg-actions button, .mini { font: inherit; font-size: 13px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); cursor: pointer; }
.mini { justify-self: start; padding: 3px 10px; font-size: 12px; }
#dlgOk { background: var(--fg); color: var(--bg); border-color: var(--fg); }

@media (max-width: 560px) {
  .brand h1 { font-size: 17px; }
  .chip { font-size: 12px; padding: 3px 10px; }
  .legend { font-size: 11px; }
}
</style>

<header class="bar">

  <span><svg width="34" height="10"><line x1="3" y1="5" x2="31" y2="5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>主体が通らなかった残り</span>
  <span><svg width="34" height="10"><line x1="3" y1="5" x2="31" y2="5" stroke="currentColor" stroke-width="6" stroke-dasharray="7 6"/></svg>同じ時間の2回目以降</span>
  <span><svg width="34" height="10"><line x1="3" y1="5" x2="31" y2="5" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 4"/></svg>切れ目のつながり</span>
  <span><svg width="14" height="12"><rect x="3" y="2" width="8" height="8" transform="rotate(45 7 6)" fill="none" stroke="currentColor" stroke-width="2"/></svg>つなぎ目（分岐・時間移動など）</span>

  <span><svg width="34" height="10"><line x1="0" y1="5" x2="34" y2="5" stroke="var(--accent)" stroke-width="1.5" stroke-opacity=".6"/></svg>いま焦点を当てている線</span>
  <span>線の長さ＝付箋の数 ＋ 時間の桁。実際の年月は「≈」とカーソル（スマホはタップ）で表示</span>

<script>
// ===== 暦 =====
// 日時は「日の通し番号（ユリウス通日）＋日の中の割合」で持つ。整数部が暦日、小数部が時刻
const J2000 = 2451545, YEAR = 365.2425, GREG_START = 2299161; // GREG_START = 1582年10月15日
const fdiv = (a, b) => Math.floor(a / b);
function jdnGreg(y, m, d) {
  const a = fdiv(14 - m, 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  return d + fdiv(153 * mm + 2, 5) + 365 * yy + fdiv(yy, 4) - fdiv(yy, 100) + fdiv(yy, 400) - 32045;
}
function jdnJul(y, m, d) {
  const a = fdiv(14 - m, 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
  return d + fdiv(153 * mm + 2, 5) + 365 * yy + fdiv(yy, 4) - 32083;
}
// 西暦：1582年10月15日以降はグレゴリオ暦、それより前はユリウス暦。y は天文式（紀元前1年 = 0）
function W(y, m = 1, d = 1, h = 0, mi = 0) {
  const g = jdnGreg(y, m, d);
  return (g >= GREG_START ? g : jdnJul(y, m, d)) + (h * 60 + mi) / 1440;
}
const ago = years => J2000 - years * YEAR;
function ymd(J) {
  const greg = J >= GREG_START;
  let shift = 0;
  if (J < 0) { const k = Math.ceil(-J / 1461); J += k * 1461; shift = 4 * k; } // ユリウス暦は4年で1461日
  let f = J + 1401;
  if (greg) f += fdiv(fdiv(4 * J + 274277, 146097) * 3, 4) - 38;
  const e = 4 * f + 3, g = fdiv(e % 1461, 4), h = 5 * g + 2;
  const M = (fdiv(h, 153) + 2) % 12 + 1;
  return [fdiv(e, 1461) - 4716 + fdiv(14 - M, 12) - shift, M, fdiv(h % 153, 5) + 1];
}
const sig = (v, n = 3) => +v.toPrecision(n);
function fmtAgo(y) {
  if (y >= 1e8) return `約${sig(y / 1e8)}億年前`;
  if (y >= 1e4) return `約${sig(y / 1e4)}万年前`;
  return `約${Math.round(y)}年前`;
}
function hm(t) { const m = Math.floor((t - Math.floor(t)) * 1440 + 1e-6); return ` ${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`; }
function fmtWest(t, name, prec) {
  const pre = name ? name + ' ' : '';
  const yearsAgo = (J2000 - t) / YEAR;
  if (yearsAgo > 12000) return pre + fmtAgo(yearsAgo);
  const n = Math.floor(t), [y, m, d] = ymd(n);
  const ys = y <= 0 ? `紀元前${1 - y}年` : `${y}年`;
  if (prec === 'year') return pre + ys;
  if (prec === 'month') return `${pre}${ys}${m}月`;
  const jul = n < GREG_START ? '（ユリウス暦）' : '';
  return `${pre}${ys}${m}月${d}日${prec === 'min' ? hm(t) : ''}${jul}`;
}
// 架空の暦（1年 = 12か月 × 30日）。月の名前は暦ごとに決められる
const DREAM_MONTHS = ['霧', '猫', '月獣', '翠玉', '黄昏', '星', '夜鬼', '琥珀', '銀鍵', '深淵', '夢見', '覚醒'];
const DR = (y, m = 1, d = 1) => (y - 1) * 360 + (m - 1) * 30 + (d - 1);
function fmtFict(t, prec, tr, withName = true) {
  const pre = withName ? tr.calName + ' ' : '';
  const n = Math.floor(t), y = fdiv(n, 360) + 1, r = n - (y - 1) * 360, m = fdiv(r, 30), d = r - m * 30 + 1;
  const mn = tr.months?.length === 12 ? `${tr.months[m]}の月` : `${m + 1}月`;
  if (prec === 'year') return `${pre}${y}年`;
  if (prec === 'month') return `${pre}${y}年 ${mn}`;
  return `${pre}${y}年 ${mn}${d}日${prec === 'min' ? hm(t) : ''}`;
}
function fmtDur(days, yearLen = YEAR) {
  const y = days / yearLen;
  if (y >= 1e8) return `${sig(y / 1e8)}億年`;
  if (y >= 1e4) return `${sig(y / 1e4)}万年`;
  if (y >= 1) return `${sig(y)}年`;
  if (days >= 1) return `${Math.round(days)}日`;
  const mins = Math.round(days * 1440);
  return mins >= 60 ? `${Math.floor(mins / 60)}時間${mins % 60 ? (mins % 60) + '分' : ''}` : `${mins}分`;
}
const precFor = span => span >= 100 * YEAR ? 'year' : span >= 2 * YEAR ? 'month' : span >= 3 ? 'day' : 'min';

// ===== サンプルの世界 =====
// cal：'west'（西暦系）か 'fict'（架空の暦）。color：線の色の番号。lane：本線より上（負）か下（正）か
const LOOP_START = W(2025, 8, 17), LOOP_END = W(2025, 8, 31, 23, 59);
let tracks = [
  { id: 'main', name: '本線', lane: 0, color: 0, cal: 'west', from: ago(13.8e9), to: W(2100) },
  { id: 'ryugu', name: '竜宮', lane: -1, color: 1, cal: 'west', from: W(720), to: W(723) },
  { id: 'beta', name: '世界線β', lane: 1, color: 2, cal: 'west', from: W(1850, 6, 1, 12), to: W(2100) },
  { id: 'dream', name: 'ドリームランド', lane: 2, color: 3, cal: 'fict', calName: '夢暦', months: DREAM_MONTHS, from: DR(1), to: DR(2001) },
];
// sync: その2点が「同じ瞬間」として結ばれている（分岐・合流・夢との出入り）。時間移動とループは同じ瞬間ではない
let links = [
  { type: 'fork', a: ['main', W(720)], b: ['ryugu', W(720)], kind: '分岐（竜宮へ）', sync: true },
  { type: 'merge', a: ['ryugu', W(723)], b: ['main', W(1020)], kind: '合流（竜宮から）', sync: true },

function eventVisible(e) {

let cards = [], cardCount = {};

// ===== 長さ：付箋（情報）が主役、時間は桁ごとに少しだけ =====
// 区切りどうしの間隔 = 最小の幅 + 付箋1枚につき4 + 時間が10倍になるごとに1（1日を単位として数える）
const G0 = 0.3, CARD = 4, JOINT = 1.2, LANE = 120, RMAX = 60;
const gapLen = (tr, t1, t2) => G0 + CARD * ((cardCount[key(tr, t1)] || 0) + (cardCount[key(tr, t2)] || 0)) / 2 + Math.log10(1 + (t2 - t1));
let viewBounds = new Set(); // いまの主体の区間の境目
// 長さを区切る時点：付箋・つながり・主体の区間の境目・世界線の端。ほかの主体の誕生日などは区切りにしない
const isSig = (tr, t) => cardCount[key(tr, t)] > 0 || LINK_ENDS.has(key(tr, t)) || viewBounds.has(key(tr, t)) || t === T[tr].from || t === T[tr].to;
function offsets(tr, a, b, curled) {
  const ns = nodesIn(tr, a, b), o = new Array(ns.length).fill(0), sig = [0];
  for (let i = 1; i < ns.length; i++) if (i === ns.length - 1 || isSig(tr, ns[i])) { const j = sig[sig.length - 1]; o[i] = o[j] + gapLen(tr, ns[j], ns[i]); sig.push(i); }
  for (let k = 0; k < sig.length - 1; k++) {
    const i0 = sig[k], i1 = sig[k + 1];
    for (let i = i0 + 1; i < i1; i++) o[i] = o[i0] + (o[i1] - o[i0]) * (ns[i] - ns[i0]) / (ns[i1] - ns[i0]);

  // ループの区間：たたむ（輪にする）ときは横に進まない
  const loops = [];
  for (const lp of LOOPS) {
    if (lp.tr !== tr) continue;
    const i0 = ns.indexOf(lp.a), i1 = ns.indexOf(lp.b);
    if (i0 < 0 || i1 < 0) continue;
    const L = o[i1] - o[i0], s = o.slice(i0, i1 + 1).map(v => v - o[i0]), c = curled.has(lp.link);

// 区間 [a, b] を「すでに通った部分」と「初めての部分」に分ける
function splitCovered(ivs, a, b) {
  const cov = mergeIv(ivs.map(([p, q]) => [Math.max(p, a), Math.min(q, b)]).filter(([p, q]) => q > p));
  const out = []; let cur = a;
  for (const [p, q] of cov) { if (p > cur) out.push({ a: cur, b: p, dup: false }); out.push({ a: p, b: q, dup: true }); cur = q; }
  if (cur < b) out.push({ a: cur, b, dup: false });

}

  for (const iv of s) { const last = out[out.length - 1]; if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]); else out.push([...iv]); }

// 主体の区間どうしのつなぎ目に対応するつながり
function jointLink(sub, li) {
  const [ta, , va] = sub.legs[li - 1], [tb, vb] = sub.legs[li];
  return links.find(l => l.a[0] === ta && l.a[1] === va && l.b[0] === tb && l.b[1] === vb);
}

// ===== 配置：世界線を切り分けて、主体が体験した順に1本につなぐ =====
function computeLayout(sub) {
  viewBounds = new Set(sub.legs.flatMap(([tr, a, b]) => [key(tr, a), key(tr, b)]));
  // ループする主体の視点では輪をほどく。それ以外の視点では輪のまま
  const unrolled = new Set(sub.legs.map((_, li) => li && jointLink(sub, li)).filter(l => l && l.loop));
  const curled = new Set(LOOPS.map(lp => lp.link).filter(l => !unrolled.has(l)));

  // 1. 中央の線：体験した区間を順に並べる。すでに通った時間はもう一度（2回目として）並べる
  sub.legs.forEach(([tr, a, b], li) => {
    if (li) x += JOINT;
    for (const s of splitCovered(cover[tr] || [], a, b)) {
      const off = offsets(tr, s.a, s.b, curled);
      const nodes = off.nodes.map(({ t, o }) => ({ t, x: x + o, y: 0 }));
      x = nodes[nodes.length - 1].x;
      pieces.push({ tr, a: s.a, b: s.b, center: true, dup: s.dup, li, tau0: tau + (s.a - a), nodes, loops: off.loops });
    }
    (cover[tr] ||= []).push([a, b]);
    tau += b - a;

  for (const p of pieces) if (!p.dup) for (const n of p.nodes) centerAt[key(p.tr, n.t)] ??= n.x;
  // 2. 通らなかった残り：切れ目のすぐ後ろ（後ろがなければ手前）にくっつける
  const lane = [];
  for (const tr of tracks) {
    const cov = mergeIv(cover[tr.id] || []);
    if (!cov.length) continue;
    let prev = tr.from;
    const rest = [];
    for (const [ca, cb] of cov) { if (ca > prev) rest.push([prev, ca]); prev = Math.max(prev, cb); }
    if (prev < tr.to) rest.push([prev, tr.to]);
    for (const [a, b] of rest) {

      const leftCut = a !== tr.from, rightCut = b !== tr.to;
      const x0 = leftCut ? centerAt[key(tr.id, a)] : centerAt[key(tr.id, b)] - L;

  for (let pass = 0; pass < 5; pass++) for (const tr of tracks) {
    if (placed.has(tr.id)) continue;
    for (const l of links) {
      if (!l.sync) continue;
      const [p, q] = l.a[0] === tr.id ? [l.b, l.a] : l.b[0] === tr.id ? [l.a, l.b] : [];
      if (!p || !placed.has(p[0])) continue;
      const ax = xAt(p[0], p[1]);
      if (ax == null) continue;
      const off = offsets(tr.id, tr.from, tr.to, curled), oq = off.nodes.find(z => z.t === q[1]).o;
      lane.push({ tr: tr.id, a: tr.from, b: tr.to, loops: off.loops, nodes: off.nodes.map(({ t, o }) => ({ t, x: ax - oq + o })) });
      placed.add(tr.id);
      break;
    }
  }
  for (const tr of tracks) if (!placed.has(tr.id)) {
    const off = offsets(tr.id, tr.from, tr.to, curled);
    lane.push({ tr: tr.id, a: tr.from, b: tr.to, loops: off.loops, nodes: off.nodes.map(({ t, o }) => ({ t, x: o })) });
  }
  // 4. 段：竜宮などは上、それ以外は下。同じ世界線の破片が重なるときは段を増やす
  const assign = (list, sign) => {
    let used = 0;
    for (const tr of list) {
      const ps = lane.filter(p => p.tr === tr.id).sort((p, q) => p.nodes[0].x - q.nodes[0].x);
      if (!ps.length) continue;
      const rows = [];
      for (const p of ps) {
        const s = p.nodes[0].x, e = p.nodes[p.nodes.length - 1].x;
        let r = rows.findIndex(end => end + .6 < s);
        if (r < 0) { r = rows.length; rows.push(e); } else rows[r] = e;
        p.y = sign * (used + 1 + r) * LANE;

      used += rows.length;
    }

  assign(tracks.filter(t => t.lane >= 0).sort((p, q) => p.lane - q.lane), 1);
  for (const p of lane) for (const n of p.nodes) n.y = p.y;
  pieces.push(...lane);
  // 各時点の「本来の位置」（2回目以降の複製ではない方）。中央の線を優先する
  const where = {}, owner = {};
  pieces.forEach((p, pi) => { if (!p.dup) p.nodes.forEach((n, ni) => { const k = key(p.tr, n.t); if (!where[k]) { where[k] = { x: n.x, y: n.y }; owner[k] = { pi, ni }; } }); });
  return { sub, pieces, where, owner, curled };
}

// ===== アニメーション：1回のなめらかな動き =====
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

let cam = { zoom: 20, panX: 0, panY: 0 };
function fitCam(layout, all = false) {
  const W = svg.clientWidth || 800;
  let lo = Infinity, hi = -Infinity;
  for (const p of layout.pieces) if (all || p.center) for (const n of p.nodes) { lo = Math.min(lo, n.x); hi = Math.max(hi, n.x); }
  const zoom = (W - 60 - Math.min(160, W * .2)) / Math.max(1e-9, hi - lo); // 右端の付箋が切れないよう余白を取る
  return { zoom, panX: 30 - lo * zoom, panY: 0 }; // panY = 0：焦点の線が画面の縦の真ん中に来る

function setView(sub, refit = true) {
  activeSub = sub;
  refreshCards();
  prev = cur;
  cur = computeLayout(sub);
  camFrom = { ...cam }; camTo = refit ? fitCam(cur) : { ...cam };
  const t0 = performance.now(), dur = reduced || !prev ? 0 : 1100;
  cancelAnimationFrame(setView.raf);
  const step = now => {
    prog = dur ? Math.min(1, (now - t0) / dur) : 1;
    const e = ease(prog);
    for (const p of ['zoom', 'panX', 'panY']) cam[p] = camFrom[p] + (camTo[p] - camFrom[p]) * e;
    render();

const svg = document.getElementById('map'), stage = document.getElementById('stage');
const tip = document.getElementById('tip'), toast = document.getElementById('toast');
const ctx2d = document.createElement('canvas').getContext('2d');
let uiFont = '12px sans-serif';
const textW = s => { ctx2d.font = uiFont; return ctx2d.measureText(s).width; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f1 = v => Math.round(v * 10) / 10;
let focusTrack = null; // カーソルを合わせた（タップした）世界線。その破片をすべて光らせる

// ループの輪：P0 から P1 へ、長さ Lpx の線を k（1 = 輪、0 = まっすぐ）だけ巻いたときの、割合 f の位置
function arcPoint(P0, P1, Lpx, k, f) {
  const th = 2 * Math.PI * k;
  if (th < 1e-3) return [P0[0] + (P1[0] - P0[0]) * f, P0[1] + (P1[1] - P0[1]) * f];
  const r = Math.min(Lpx / th, RMAX), ph = th * f;
  const ex = r * Math.sin(th), ey = r * (1 - Math.cos(th));
  return [P0[0] + r * Math.sin(ph) + f * (P1[0] - P0[0] - ex), P0[1] + r * (1 - Math.cos(ph)) + f * (P1[1] - P0[1] - ey)];
}
// ある配置を、前の配置から e だけ進めたときの画面上の形を計算する
function buildFrame(lay, from, e, cm) {

  const SX = x => x * cm.zoom + cm.panX, SY = y => y + H / 2 + cm.panY;
  const ps = [], scr = {};
  lay.pieces.forEach((p, pi) => {
    if (hiddenTracks.has(p.tr)) return;
    const S = p.nodes.map(n => {
      const f = from && e < 1 ? from.where[key(p.tr, n.t)] : null;
      return f ? [SX(f.x + (n.x - f.x) * e), SY(f.y + (n.y - f.y) * e)] : [SX(n.x), SY(n.y)];

    let d = `M${f1(S[0][0])},${f1(S[0][1])}`;

    for (let i = 1; i < S.length; i++) {
      const lp = p.loops.find(z => z.i0 === i - 1);
      if (lp) {
        const k1 = lp.curled ? 1 : 0, k0 = from && e < 1 ? (from.curled.has(lp.link) ? 1 : 0) : k1, k = k0 + (k1 - k0) * e;
        const P0 = S[lp.i0], P1 = S[lp.i1], Lpx = lp.L * cm.zoom;

      }
      d += ` L${f1(S[i][0])},${f1(S[i][1])}`;

    for (const s of byRow[r].sort((a, b) => a.x - b.x || (a.c.grp ? -1 : 1))) {

function render() {

function inRange(tr, t) {
  const s = T[tr];
  if (t < s.from || t > s.to) throw `「${s.name}」の範囲外の日時です（${s.short(s.from, 'day')}〜${s.short(s.to, 'day')}）`;
}

// 日時の入力欄。spec は世界線（または新しく作る世界線の暦 { cal, calName }）
function partsOf(spec, t) {
  const n = Math.floor(t), mins = Math.floor((t - n) * 1440 + 1e-6);
  const hhmm = `${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`;
  if (spec.cal === 'fict') { const y = fdiv(n, 360) + 1, r = n - (y - 1) * 360, m = fdiv(r, 30); return { mode: 'ad', y, m: m + 1, d: r - m * 30 + 1, hm: hhmm }; }
  const ya = (J2000 - t) / YEAR;
  if (ya > 12000) { const u = ya >= 1e8 ? 1e8 : 1e4; return { mode: 'ago', n: sig(ya / u, 4), u }; }
  const [y, m, d] = ymd(n);
  return { mode: 'ad', bc: y <= 0, y: y <= 0 ? 1 - y : y, m, d, hm: hhmm };
}
function timeOf(spec, v) {
  if (v.mode === 'ago') { const n = +v.n; if (!(n > 0)) throw '「〜年前」には正の数を入れてください'; return ago(n * v.u); }
  if (v.y === '' || !Number.isFinite(+v.y)) throw '年を入れてください';
  const y = Math.trunc(+v.y), m = Math.trunc(+v.m || 1), d = Math.trunc(+v.d || 1);
  const [hh, mi] = (v.hm || '00:00').split(':').map(Number);
  if (spec.cal === 'fict') {
    if (m < 1 || m > 12 || d < 1 || d > 30) throw 'その暦にない日付です（1年＝12か月×30日）';
    return DR(y, m, d) + (hh * 60 + mi) / 1440;
  }
  const ya = v.bc ? 1 - y : y, t = W(ya, m, d, hh, mi), [cy, cm, cd] = ymd(Math.floor(t));
  if (m < 1 || m > 12 || cy !== ya || cm !== m || cd !== d) throw 'その日付は暦にありません（例：2月30日、1582年10月5〜14日）';
  return t;
}
function dateHTML(p, spec, t) {
  const v = partsOf(spec, t), fict = spec.cal === 'fict', isAgo = v.mode === 'ago';
  return `<span class="dt">` +
    (fict ? `<span class="cal">${esc(spec.calName || '架空の暦')}</span>` :
      `<select id="${p}_mode" aria-label="入力のしかた"><option value="ad">西暦</option><option value="ago"${isAgo ? ' selected' : ''}>〜年前</option></select>`) +
    `<span class="ad"${isAgo ? ' hidden' : ''}>` +
    (fict ? '' : `<label><input type="checkbox" id="${p}_bc"${v.bc ? ' checked' : ''}>紀元前</label>`) +
    `<input type="number" id="${p}_y" value="${v.y ?? ''}" aria-label="年">年` +
    `<input type="number" id="${p}_m" min="1" max="12" value="${v.m ?? 1}" aria-label="月">月` +
    `<input type="number" id="${p}_d" min="1" max="31" value="${v.d ?? 1}" aria-label="日">日` +
    `<input type="time" id="${p}_hm" value="${v.hm ?? '00:00'}" aria-label="時刻"></span>` +
    (fict ? '' : `<span class="ago"${isAgo ? '' : ' hidden'}><input type="number" step="any" min="0" id="${p}_n" value="${v.n ?? ''}" aria-label="何年前">` +
      `<select id="${p}_u" aria-label="単位"><option value="1">年</option><option value="10000"${v.u === 1e4 ? ' selected' : ''}>万年</option><option value="100000000"${v.u === 1e8 ? ' selected' : ''}>億年</option></select>前</span>`) +
    `</span>`;
}
function readDate(p, spec) {
  const g = s => $(`${p}_${s}`);
  return timeOf(spec, { mode: g('mode')?.value || 'ad', bc: g('bc')?.checked, y: g('y').value, m: g('m').value, d: g('d').value, hm: g('hm').value, n: g('n')?.value, u: +(g('u')?.value || 1) });
}
const dateFld = (label, p, spec, t) => `<div class="fld"><span>${label}</span><div id="${p}Box">${dateHTML(p, spec, t)}</div></div>`;
const redate = (p, spec, t) => { $(`${p}Box`).innerHTML = dateHTML(p, spec, t); };

// 付箋
function cardForm(i, preset = {}) {
  const e = i != null ? events[i] : { tr: preset.tr || 'main', t: preset.t ?? W(2000), title: '', tags: [] };
  openDlg(i != null ? '付箋を編集' : '付箋を追加', `
    <label>名前<input id="f_title" value="${esc(e.title)}" autocomplete="off"></label>
    <label>タグ（「、」で区切る）<input id="f_tags" value="${esc(e.tags.join('、'))}" autocomplete="off"></label>
    <label>世界線${trackSel('f_tr', e.tr)}</label>
    ${dateFld('日時', 'f_date', T[e.tr], e.t)}
    <label>まとめ<select id="f_group"><option value="">なし</option>${Object.entries(groups).map(([g, v]) => `<option value="${g}"${e.group === g ? ' selected' : ''}>${esc(v.title)}</option>`).join('')}<option value="__new">新しいまとめを作る…</option></select></label>
    <label id="f_gnewL" hidden>新しいまとめの名前<input id="f_gnew" autocomplete="off"></label>`,
    () => {
      const title = val('f_title').trim(); if (!title) throw '名前を入れてください';
      const tr = val('f_tr'), t = readDate('f_date', T[tr]); inRange(tr, t);
      let group = val('f_group'); const gname = val('f_gnew').trim(), tags = splitList(val('f_tags'));
      if (group === '__new' && !gname) throw 'まとめの名前を入れてください';
      commit(() => {
        if (group === '__new') { group = 'g' + uid(); groups[group] = { title: gname, open: true }; }
        const obj = { tr, t, title, tags };
        if (group) obj.group = group;
        if (i != null) events[i] = obj; else events.push(obj);
      });
    },
    i != null ? () => commit(() => events.splice(i, 1)) : null,
    ev => {
      if (ev.target.id === 'f_tr') redate('f_date', T[ev.target.value], T[ev.target.value].from);
      if (ev.target.id === 'f_group') $('f_gnewL').hidden = ev.target.value !== '__new';
    });
  $('f_title').focus();
}

// 世界線
function refTimes(id) {
  return [...events.filter(e => e.tr === id).map(e => e.t), ...links.flatMap(l => [l.a, l.b]).filter(p => p[0] === id).map(p => p[1]),
    ...subjects.flatMap(s => s.legs).filter(l => l[0] === id).flatMap(l => [l[1], l[2]])];
}
function trackForm(id, preset = {}) {
  const tr = id ? T[id] : null, isMain = id === 'main';
  const spec = () => tr || (val('k_cal') === 'fict' ? { cal: 'fict', calName: val('k_calName').trim() || '架空の暦' } : { cal: 'west' });
  const from0 = tr ? tr.from : preset.t ?? W(2000), to0 = tr ? tr.to : T.main.to, forkTr = preset.tr || 'main';
  openDlg(tr ? '世界線を編集' : '世界線を追加', `
    <label>名前<input id="k_name" value="${esc(tr ? tr.name : '')}" autocomplete="off"></label>
    ${tr ? `<p class="note">暦：${tr.cal === 'fict' ? esc(tr.calName) + '（架空の暦）' : isMain ? '西暦' : `西暦系（「西暦;${esc(tr.name)}」と表示）`}</p>` : `
    <label>暦<select id="k_cal"><option value="west">西暦系（分岐した時間など。「西暦;名前」と表示）</option><option value="fict">架空の暦（1年＝12か月×30日）</option></select></label>
    <div id="k_calBox" class="sub" hidden>
      <label>暦の名前<input id="k_calName" value="夢暦" autocomplete="off"></label>
      <label>月の名前（12個を「、」で区切る。空なら1月〜12月）<input id="k_months" autocomplete="off"></label>
    </div>`}
    ${isMain ? '' : `<label>置き場所<select id="k_side"><option value="down">本線の下</option><option value="up"${tr && tr.lane < 0 ? ' selected' : ''}>本線の上</option></select></label>`}
    ${dateFld('始まり', 'k_from', tr || { cal: 'west' }, from0)}
    ${dateFld('終わり', 'k_to', tr || { cal: 'west' }, to0)}
    ${tr ? '' : `
    <label class="cb"><input type="checkbox" id="k_fork_on"${preset.tr ? ' checked' : ''}>始まりを、別の世界線から分かれたことにする</label>
    <div id="k_forkRow" class="sub"${preset.tr ? '' : ' hidden'}><label>分かれる元${trackSel('k_forkTr', forkTr)}</label>${dateFld('分かれる日時', 'k_fork', T[forkTr], preset.t ?? from0)}</div>
    <label class="cb"><input type="checkbox" id="k_merge_on">終わりを、別の世界線に合流させる</label>
    <div id="k_mergeRow" class="sub" hidden><label>合流先${trackSel('k_mergeTr', 'main')}</label>${dateFld('合流する日時', 'k_merge', T.main, W(2000))}</div>`}`,
    () => {
      const name = val('k_name').trim(); if (!name) throw '名前を入れてください';
      const s = spec(), from = readDate('k_from', s), to = readDate('k_to', s);
      if (!(from < to)) throw '終わりは始まりより後にしてください';
      if (tr) {
        const refs = refTimes(id);
        if (refs.length && (from > Math.min(...refs) || to < Math.max(...refs)))
          throw `付箋・つながり・主体の区間が範囲からはみ出します（${tr.short(Math.min(...refs), 'day')}〜${tr.short(Math.max(...refs), 'day')} を含めてください）`;
      }
      let fork = null, merge = null, months = null;
      if (!tr && $('k_fork_on').checked) { const ft = val('k_forkTr'), t = readDate('k_fork', T[ft]); inRange(ft, t); fork = [ft, t]; }
      if (!tr && $('k_merge_on').checked) { const mt = val('k_mergeTr'), t = readDate('k_merge', T[mt]); inRange(mt, t); merge = [mt, t]; }
      if (!tr && s.cal === 'fict') { months = splitList(val('k_months')); if (months.length && months.length !== 12) throw '月の名前は12個にしてください'; }
      const up = !isMain && val('k_side') === 'up';
      commit(() => {
        if (tr) {
          const t = tracks.find(x => x.id === id), mag = Math.abs(t.lane) || 1;
          Object.assign(t, { name, from, to });
          if (!isMain) t.lane = up ? -mag : mag;
          return;
        }
        const nid = 't' + uid(), mag = Math.max(...tracks.map(x => Math.abs(x.lane))) + 1;
        const t = { id: nid, name, lane: up ? -mag : mag, color: tracks.length % 6, cal: s.cal, from, to };
        if (s.cal === 'fict') { t.calName = s.calName; if (months.length) t.months = months; }
        tracks.push(t);
        if (fork) links.push({ type: 'fork', a: fork, b: [nid, from], kind: `分岐（${name}へ）`, sync: true });
        if (merge) links.push({ type: 'merge', a: [nid, to], b: merge, kind: `合流（${name}から）`, sync: true });
      });
    },
    tr && !isMain ? () => {
      const n = { e: events.filter(e => e.tr === id).length, l: links.filter(l => l.a[0] === id || l.b[0] === id).length, s: subjects.filter(s => s.legs.some(l => l[0] === id)).length };
      if (n.e || n.l || n.s) throw `この世界線を使っているものがあるので削除できません（付箋${n.e}・つながり${n.l}・主体${n.s}）`;
      commit(() => { tracks = tracks.filter(t => t.id !== id); });
    } : null,
    ev => {
      const i = ev.target.id;
      if (i === 'k_cal') { const s = spec(); $('k_calBox').hidden = s.cal !== 'fict'; redate('k_from', s, s.cal === 'fict' ? DR(1) : from0); redate('k_to', s, s.cal === 'fict' ? DR(1001) : to0); }
      if (i === 'k_calName') { const s = spec(); redate('k_from', s, readDateSafe('k_from', s, DR(1))); redate('k_to', s, readDateSafe('k_to', s, DR(1001))); }
      if (i === 'k_forkTr') redate('k_fork', T[ev.target.value], T[ev.target.value].from);
      if (i === 'k_mergeTr') redate('k_merge', T[ev.target.value], T[ev.target.value].from);
      if (i === 'k_fork_on') $('k_forkRow').hidden = !ev.target.checked;
      if (i === 'k_merge_on') $('k_mergeRow').hidden = !ev.target.checked;
    });
  $('k_name').focus();
}
function readDateSafe(p, spec, fallback) { try { return readDate(p, spec); } catch { return fallback; } }

// つながり
const LINK_TYPES = { fork: ['分岐', true], merge: ['合流', true], cross: ['世界線の出入り（夢など）', true], jump: ['時間移動', false], loop: ['ループ', false] };
function linkForm(i, preset = {}) {
  const l = i != null ? links[i] : null;
  const type = l ? l.type || (l.loop ? 'loop' : l.sync ? 'cross' : 'jump') : 'jump';
  const at = l ? l.a[0] : preset.tr || 'main', av = l ? l.a[1] : preset.t ?? W(2000);
  const bt = l ? l.b[0] : at, bv = l ? l.b[1] : av;
  const lt = l?.loop ? l.a[0] : preset.tr || 'main', ls = l?.loop ? l.b[1] : preset.t ?? W(2000), le = l?.loop ? l.a[1] : (preset.t ?? W(2000)) + 14;
  openDlg(l ? 'つながりを編集' : 'つながりを追加', `
    <label>種類<select id="l_type">${Object.entries(LINK_TYPES).map(([k, [nm]]) => `<option value="${k}"${k === type ? ' selected' : ''}>${nm}</option>`).join('')}</select></label>
    <p class="note" id="l_help"></p>
    <label>表示する名前（空なら種類の名前）<input id="l_kind" value="${esc(l ? l.kind : '')}" autocomplete="off"></label>
    <div id="l_std" class="sub"${type === 'loop' ? ' hidden' : ''}>
      <label>出発する世界線${trackSel('l_aTr', at)}</label>${dateFld('出発する日時', 'l_a', T[at], av)}
      <label>到着する世界線${trackSel('l_bTr', bt)}</label>${dateFld('到着する日時', 'l_b', T[bt], bv)}
      <label class="cb" id="l_parL"${type === 'jump' ? '' : ' hidden'}><input type="checkbox" id="l_par"${l?.paradox ? ' checked' : ''}>パラドックスが起きた</label>
    </div>
    <div id="l_loop" class="sub"${type === 'loop' ? '' : ' hidden'}>
      <label>ループする世界線${trackSel('l_lTr', lt)}</label>${dateFld('ループの始まり', 'l_ls', T[lt], ls)}${dateFld('ループの終わり（ここから始まりに戻る）', 'l_le', T[lt], le)}
    </div>`,
    () => {
      const ty = val('l_type'), kind = val('l_kind').trim() || LINK_TYPES[ty][0];
      let obj;
      if (ty === 'loop') {
        const tr = val('l_lTr'), s = readDate('l_ls', T[tr]), e = readDate('l_le', T[tr]);
        inRange(tr, s); inRange(tr, e);
        if (!(s < e)) throw 'ループの終わりは始まりより後にしてください';
        if (links.some((o, k) => k !== i && o.loop && o.a[0] === tr && o.b[1] < e && s < o.a[1])) throw '同じ世界線で、ほかのループと期間が重なっています';
        obj = { type: ty, a: [tr, e], b: [tr, s], kind, loop: true };
      } else {
        const a = val('l_aTr'), av2 = readDate('l_a', T[a]), b = val('l_bTr'), bv2 = readDate('l_b', T[b]);
        inRange(a, av2); inRange(b, bv2);
        if (a === b && av2 === bv2) throw '出発と到着が同じです';
        obj = { type: ty, a: [a, av2], b: [b, bv2], kind };
        if (LINK_TYPES[ty][1]) obj.sync = true;
        if (ty === 'jump' && $('l_par').checked) obj.paradox = true;
      }
      commit(() => { if (i != null) links[i] = obj; else links.push(obj); });
    },
    l ? () => commit(() => links.splice(i, 1)) : null,
    ev => {
      const id = ev.target.id;
      if (id === 'l_type') { const ty = ev.target.value; $('l_std').hidden = ty === 'loop'; $('l_loop').hidden = ty !== 'loop'; $('l_parL').hidden = ty !== 'jump'; linkHelp(); }
      if (id === 'l_aTr') redate('l_a', T[ev.target.value], T[ev.target.value].from);
      if (id === 'l_bTr') redate('l_b', T[ev.target.value], T[ev.target.value].from);
      if (id === 'l_lTr') { redate('l_ls', T[ev.target.value], T[ev.target.value].from); redate('l_le', T[ev.target.value], T[ev.target.value].from + 14); }
    });
  linkHelp();
}
function linkHelp() {
  $('l_help').textContent = {
    fork: '出発点と同じ瞬間に、到着する世界線が始まります。', merge: '出発点（分かれた世界線の終わり）と同じ瞬間に、到着する世界線へ戻ります。',
    cross: '夢に入る・目覚めるなど、同じ瞬間に別の世界へ移ります。位置合わせに使います。',
    jump: '過去や未来へ跳びます。主体の区間どうしのつなぎ目（◆）の説明にもなります。', loop: '終わりまで来ると始まりに戻ります。線の上の輪として描きます。',
  }[val('l_type')];
}

// 主体
function subjectForm(id) {
  const s = id ? subjects.find(x => x.id === id) : { name: '', legs: [['main', W(2000), W(2050)]] };
  let next = s.legs.length;
  const row = (r, [tr, a, b]) => `<div class="leg" data-r="${r}"><div class="leg-h"><b></b>${trackSel(`s_tr_${r}`, tr)}<button type="button" class="mini" data-del="${r}">この区間を削除</button></div>${dateFld('入った', `s_a_${r}`, T[tr], a)}${dateFld('出た', `s_b_${r}`, T[tr], b)}</div>`;
  openDlg(id ? '主体を編集' : '主体を追加', `
    <label>名前<input id="s_name" value="${esc(s.name)}" autocomplete="off"></label>
    <p class="note">本人が体験した順に、区間（どの世界線の、いつからいつまで）を並べます。区間どうしのあいだの時間移動や分岐は「＋ つながり」で作ると、つなぎ目（◆）の説明に出ます。</p>
    <div id="s_legs">${s.legs.map((l, r) => row(r, l)).join('')}</div>
    <button type="button" class="mini" id="s_add">＋ 区間を追加</button>`,
    () => {
      const name = val('s_name').trim(); if (!name) throw '名前を入れてください';
      const legs = [...dlgBody.querySelectorAll('.leg')].map((el, k) => {
        const r = el.dataset.r, tr = val(`s_tr_${r}`), a = readDate(`s_a_${r}`, T[tr]), b = readDate(`s_b_${r}`, T[tr]);
        if (!(a < b)) throw `区間${k + 1}：出た日時は、入った日時より後にしてください`;
        inRange(tr, a); inRange(tr, b);
        return [tr, a, b];
      });
      if (!legs.length) throw '区間を1つ以上入れてください';
      commit(() => {
        if (id) subjects[subjects.findIndex(x => x.id === id)] = { id, name, legs };
        else { const nid = 's' + uid(); subjects.push({ id: nid, name, legs }); activeSub = { id: nid }; }
      });
    },
    id ? () => commit(() => { subjects = subjects.filter(x => x.id !== id); }) : null,
    ev => {
      const m = ev.target.id.match(/^s_tr_(\d+)$/);
      if (m) { const tr = T[ev.target.value]; redate(`s_a_${m[1]}`, tr, tr.from); redate(`s_b_${m[1]}`, tr, tr.to); }
    },
    ev => {
      if (ev.target.id === 's_add') {
        const last = [...dlgBody.querySelectorAll('.leg')].pop(), tr = last ? val(`s_tr_${last.dataset.r}`) : 'main';
        const a = last ? readDateSafe(`s_b_${last.dataset.r}`, T[tr], T[tr].from) : T[tr].from;
        $('s_legs').insertAdjacentHTML('beforeend', row(next++, [tr, a, Math.min(T[tr].to, a + 3650)]));
      }
      if (ev.target.dataset.del) ev.target.closest('.leg').remove();
    });
  $('s_name').focus();
}

// 線をクリックしたときのメニュー
const menu = document.getElementById('menu');
function hideMenu() { menu.hidden = true; }
function openMenu(pi, clientX, clientY) {
  const r = stage.getBoundingClientRect(), p = cur.pieces[pi];
  const t = Math.round(pieceTimeAt(p, (clientX - r.left - cam.panX) / cam.zoom).t * 1440) / 1440;
  menu.innerHTML = `<div class="m-h">${esc(T[p.tr].name)}<br><span>${esc(T[p.tr].fmt(t, 'min'))}</span></div>` +
    `<button data-a="card" role="menuitem">＋ ここに付箋</button><button data-a="fork" role="menuitem">＋ ここから分かれる世界線</button>` +
    `<button data-a="link" role="menuitem">＋ ここからつながり</button><button data-a="edit" role="menuitem">この世界線を編集</button>`;
  menu.onclick = ev => {
    const a = ev.target.dataset.a;
    if (a === 'card') cardForm(null, { tr: p.tr, t });
    if (a === 'fork') trackForm(null, { tr: p.tr, t });
    if (a === 'link') linkForm(null, { tr: p.tr, t });
    if (a === 'edit') trackForm(p.tr);
  };
  menu.hidden = false;
  const x = Math.min(clientX - r.left + 6, r.width - menu.offsetWidth - 8), y = Math.min(clientY - r.top + 6, r.height - menu.offsetHeight - 8);
  menu.style.left = Math.max(8, x) + 'px'; menu.style.top = Math.max(8, y) + 'px';
  menu.querySelector('button').focus();
}

// 編集のボタン
$('addCard').onclick = () => cardForm(null);
$('addTrack').onclick = () => trackForm(null);
$('addLink').onclick = () => linkForm(null);
$('addSub').onclick = () => subjectForm(null);
$('editSub').onclick = () => activeSub.id && subjectForm(activeSub.id);
undoBtn.onclick = undo;
$('reset').onclick = ev => {
  const b = ev.currentTarget;
  if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'もう一度押すとサンプルに戻す'; setTimeout(() => { delete b.dataset.armed; b.textContent = 'サンプルに戻す'; }, 4000); return; }
  delete b.dataset.armed; b.textContent = 'サンプルに戻す';
  commit(() => restore(SAMPLE));
};
addEventListener('keydown', e => {
  if (e.key === 'Escape') hideMenu();
  const typing = ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement?.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !dlg.open && !typing) { e.preventDefault(); undo(); }
});

// ===== イースターエッグ =====
function egg(sub) {
  toast.hidden = true;
  if (!sub.id) return;
  let kind = null;
  for (let li = 1; li < sub.legs.length; li++) {
    const l = jointLink(sub, li);
    if (l?.paradox) kind = 'paradox';
    else if (l?.loop && !kind) kind = 'loop';
  }
  if (!kind) {
    const L = sub.legs;
    for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++)
      if (L[i][0] === L[j][0] && L[i][1] < L[j][2] && L[j][1] < L[i][2]) kind = 'self';
  }
  const msg = {
    paradox: '気をつけろ、マーティー！ 過去をいじったせいで、世界線が分かれちまったぞ！',
    self: 'グレート・スコット！ 同じ時刻に、もう一人の自分がいるぞ！ 鉢合わせだけはするなよ！',
    loop: 'この夏休み、もう何度目だ……？ エル・プサイ・コングルゥ。',
  }[kind];
  if (!msg) return;
  toast.textContent = msg; toast.hidden = false;
  clearTimeout(egg.t); egg.t = setTimeout(() => { toast.hidden = true; }, 6000);
}
toast.onclick = () => { toast.hidden = true; };

// ===== 開始 =====
if (innerWidth < 560) document.getElementById('legend').open = false; // スマホでは凡例をたたんで地図を広く
uiFont = '12px ' + getComputedStyle(document.body).fontFamily;
const SAMPLE = snapshot();
try {
  const saved = localStorage.getItem(STORE);
  if (saved) { restore(saved); if (!tracks.some(t => t.id === 'main')) restore(SAMPLE); }
} catch { restore(SAMPLE); }
rebuild();
renderChips();
setView(OBJECTIVE);
document.fonts?.ready.then(() => { uiFont = '12px ' + getComputedStyle(document.body).fontFamily; render(); });
</script>
